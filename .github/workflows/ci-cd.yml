name: 🚀 CI / CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 🧪 1. Run Tests ───────────────────────────────────────────
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: ✅ Run pytest
        run: pytest tests/ -v --tb=short

      - name: 📊 Test summary
        if: always()
        run: echo "Tests completed on Python 3.12"

  # ── 🐳 2. Build & Push Docker Image ──────────────────────────
  docker:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔍 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/snip-url-shortener
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: 🏗️ Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 🎉 Image pushed successfully
        run: echo "Docker image pushed → ${{ steps.meta.outputs.tags }}"

  # ── 🌐 3. Deploy to Render ────────────────────────────────────
  deploy:
    name: 🌐 Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Trigger Render deploy hook
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: ✅ Deploy triggered
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🌐 Deployment triggered on Render"
          echo "  📦 Commit: ${{ github.sha }}"
          echo "  👤 Author: ${{ github.actor }}"
          echo "  🕐 Time:   $(date -u)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"